<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f3ec">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120f">
  <title>Le mie cose</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <button id="backBtn" class="icon-btn" aria-label="Indietro" hidden>←</button>
      <h1><span id="heading">Le mie cose</span> <span id="syncStatus" class="sync-status"></span></h1>
      <button id="menuBtn" class="icon-btn" aria-label="Menu">⋮</button>
    </div>
    <div class="search">
      <input id="search" type="search" placeholder="Cerca in tutto…" autocomplete="off">
    </div>
    <nav id="statusTabs" class="tabs" hidden></nav>
    <div id="chips" class="chips filter-row" hidden></div>
    <div id="placeChips" class="chips filter-row" hidden></div>
  </header>

  <main>
    <div id="hint" class="hint" hidden></div>
    <div id="tiles" class="tiles" hidden></div>
    <h2 id="listTitle" class="list-title" hidden></h2>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <button id="addBtn" class="fab" aria-label="Aggiungi">+</button>

  <!-- Scelta del tipo -->
  <div id="picker" class="sheet" hidden>
    <div class="sheet-body">
      <div class="sheet-head">
        <span></span><strong>Cosa vuoi segnare?</strong>
        <button type="button" class="link-btn" data-close>Chiudi</button>
      </div>
      <div id="pickerList" class="picker-list"></div>
    </div>
  </div>

  <!-- Editor -->
  <div id="sheet" class="sheet" hidden>
    <form id="editor" class="sheet-body" novalidate>
      <div class="sheet-head">
        <button type="button" class="link-btn" data-close>Annulla</button>
        <strong id="editorTitle"></strong>
        <button type="submit" class="primary">Salva</button>
      </div>
      <input id="fTitle" autocomplete="off" enterkeyhint="done">

      <div id="fStatus" class="seg"></div>
      <div id="fStarsWrap" class="field">
        <span class="field-label">Quanto ti è piaciuto?</span>
        <div id="fStars" class="stars" role="group" aria-label="Voto da 1 a 5"></div>
      </div>

      <div id="fKindWrap" class="field">
        <span class="field-label" id="fKindLabel"></span>
        <div id="fKind" class="seg"></div>
      </div>
      <div id="fMakerWrap" class="field">
        <label class="field-label" id="fMakerLabel" for="fMaker"></label>
        <input id="fMaker" autocomplete="off">
        <div id="fMakerSuggest" class="chips suggest" hidden></div>
      </div>
      <div id="fPlaceWrap" class="field">
        <label class="field-label" id="fPlaceLabel" for="fPlace"></label>
        <input id="fPlace" autocomplete="off">
        <div id="fPlaceSuggest" class="chips suggest" hidden></div>
      </div>
      <div id="fExtraWrap" class="field">
        <label class="field-label" id="fExtraLabel" for="fExtra"></label>
        <input id="fExtra" autocomplete="off">
      </div>
      <div id="fTagChoiceWrap" class="field">
        <span class="field-label">Tag <small>(puoi sceglierne più di uno)</small></span>
        <div id="fTagChoice" class="tag-choice"></div>
        <div class="new-tag">
          <input id="fNewTag" placeholder="Aggiungi un tag…" autocomplete="off" enterkeyhint="done" aria-label="Nuovo tag">
          <button type="button" id="fNewTagBtn" class="chip">Aggiungi</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="fBody">Appunti</label>
        <div id="fFormat" class="format-bar" role="toolbar" aria-label="Formattazione">
          <button type="button" data-marker="**" aria-label="Grassetto"><strong>G</strong></button>
          <button type="button" data-marker="==" aria-label="Evidenziato"><mark class="hl">Ev</mark></button>
          <button type="button" data-prefix="- " aria-label="Elenco puntato">• Elenco</button>
          <button type="button" data-prefix="- [ ] " aria-label="Caselle da spuntare">☑ Lista</button>
        </div>
        <textarea id="fBody" rows="3"></textarea>
        <div id="fBodyPreview" class="body-preview" aria-label="Anteprima" hidden></div>
      </div>

      <div id="noteFields" class="field-group">
        <div class="field">
          <span class="field-label">Categoria</span>
          <div id="fCat" class="seg"></div>
        </div>
        <div class="field">
          <span class="field-label">Priorità</span>
          <div id="fPrio" class="seg"></div>
        </div>
        <div class="field">
          <label class="field-label" for="fTags">Tag <small>(separati da spazio o virgola)</small></label>
          <input id="fTags" placeholder="es. spesa urgente telefonare" autocomplete="off">
          <div id="tagSuggest" class="chips"></div>
        </div>
      </div>

      <button type="button" id="deleteBtn" class="danger" hidden>Elimina</button>
    </form>
  </div>

  <!-- Menu -->
  <div id="menu" class="sheet" hidden>
    <div class="sheet-body">
      <div class="sheet-head">
        <span></span><strong>Opzioni</strong>
        <button type="button" class="link-btn" data-close>Chiudi</button>
      </div>
      <div id="syncBox" class="sync-box" hidden>
        <p id="syncInfo" class="small"></p>
        <button id="syncBtn" class="primary">Accedi con Google</button>
      </div>
      <button id="reorderBtn" class="menu-item">↕︎ Cambia l'ordine dei riquadri</button>
      <button id="exportBtn" class="menu-item">⬇︎ Esporta backup (.json)</button>
      <label class="menu-item">⬆︎ Importa backup
        <input id="importInput" type="file" accept="application/json" hidden>
      </label>
      <button id="clearDoneBtn" class="menu-item">🧹 Elimina le note completate</button>
      <p class="muted small" id="stats"></p>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
